# SPDX-License-Identifier: CC0-1.0

[project]
name = "ite8291r3-ctl"
description = "ITE 8291 (rev 0.03) userspace driver"
license = "GPL-2.0-only"
dependencies = [
	"pyusb",
]
keywords = [
	"ITE",
	"ITE8291",
	"RGB",
	"keyboard",
	"backlight",
	"linux",
]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Environment :: Console",
	"Intended Audience :: End Users/Desktop",
	"Natural Language :: English",
	"Operating System :: POSIX :: Linux",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.6",
	"Topic :: System :: Hardware :: Hardware Drivers",
	"Topic :: Utilities",
]
authors = [
	{ name = "Barnabás Pőcze", email = "pobrn@protonmail.com" },
]
requires-python = ">=3.6"
readme = "README.md"
dynamic = [
	"version",
]

[project.optional-dependencies]
mode-screen = [
	"python-xlib",
	"Pillow",
]

[project.scripts]
ite8291r3-ctl = "ite8291r3_ctl.__main__:main"

[project.urls]
Homepage = "https://github.com/pobrn/ite8291r3-ctl"
Repository = "https://github.com/pobrn/ite8291r3-ctl"
Issues = "https://github.com/pobrn/ite8291r3-ctl/issues"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "ite8291r3_ctl.__version__" }

[tool.setuptools]
packages = ["ite8291r3_ctl"]
